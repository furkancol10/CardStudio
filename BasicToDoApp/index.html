<!DOCTYPE html>

<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>To Do Uygulaması</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <h1>ToDo Uygulaması</h1>
    <div class="todo-container">

        <div class=" todo-add">
            <input type="text"
                   id="todo-input"
                   placeholder="Yeni görev yazın..." />
            <button id="todo-add-button">Ekle</button>
        </div>

        <div class="todo-list">
            <ul id="todo-items">
                <!-- Görevler buraya JS ile eklenecek-->
            </ul>
        </div>

    </div>
    <script src="js/app.js"></script>
</body>
</html>
