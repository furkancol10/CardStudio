<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Kartvizit Studio</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <h1>Kartvizit Studio</h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="login.html" class="btn">Giriş Yap</a></li>
                    <li><a href="editor.html" class="btn primary-btn">Tasarla</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="preview-section">
            <div class="preview-container">
                <h2>Kartvizit Önizleme</h2>

                <div class="card-wrapper">
                    <div class="card-3d" id="businessCard">
                        <!--Ön Yüz-->
                        <div class="card-face card-front">
                            <div class="card-content">
                                <p class="card-name">Adınız Soyadınız</p>
                                <p class="card-title">Unvanınız</p>
                                <p class="card-contact">Telefon: 05XX XXX XX XX</p>
                                <p class="card-contact">E-Posta: adiniz@sirketiniz.com</p>
                                <p class="card-company">Şirket Adı</p>
                            </div>
                        </div>


                        <!--Arka Yüz-->
                        <div class="card-face card-back">
                            <div class="card-content">
                                <p class="card-slogan">Sloganınız buraya gelecek</p>
                                <p class="card-website">www.sirketiniz.com</p>
                                <p class="card-address">Adresiniz, Şehir, Ülke</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
